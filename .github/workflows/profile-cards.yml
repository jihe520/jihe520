name: Update GitHub profile cards

on:
  push:
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&title_color=6366f1&text_color=f97316&icon_color=6366f1&bg_color=27272a&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.3
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=10&title_color=6366f1&text_color=f97316&icon_color=6366f1&bg_color=27272a&hide_border=true&locale=en&custom_title=Top%20Languages
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.3
          fail_on_error: "true"

      - name: Commit updated cards
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): update GitHub stats cards"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
