name: Update GitHub profile cards

on:
  push:
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}

      - name: Fetch and validate public stats cards
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          # Keep a local snapshot so API downtime cannot break the profile.
          staging="$RUNNER_TEMP/profile-cards"
          mkdir -p "$staging"
          base="https://github-stats-extended.vercel.app/api"
          options="username=$PROFILE_OWNER&title_color=6366f1&text_color=f97316&icon_color=6366f1&bg_color=27272a&hide_border=true"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 60 \
            "$base?$options&show_icons=true" -o "$staging/stats.svg"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 60 \
            "$base/top-langs/?$options&langs_count=10&locale=en&custom_title=Top%20Languages" -o "$staging/top-langs.svg"
          python3 - "$staging" <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for name in ("stats.svg", "top-langs.svg"):
              root = ET.parse(Path(sys.argv[1]) / name).getroot()
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG: {name}")
              text = " ".join(root.itertext()).lower()
              if any(error in text for error in ("something went wrong", "maximum retries", "please add an env")):
                  raise SystemExit(f"Stats service returned an error card: {name}")
              expected = "total stars" if name == "stats.svg" else "top languages"
              if expected not in text:
                  raise SystemExit(f"Missing card data: {name}")
              print(f"Validated {name}")
          PY
          mkdir -p profile
          mv "$staging/stats.svg" "$staging/top-langs.svg" profile/

      - name: Commit updated cards
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(profile): update GitHub stats cards"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
